name: Clean profile README history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/clean-profile-history.yml

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: false

jobs:
  clean-history:
    if: github.repository == 'NFULL07/NFULL07' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Configure repository authentication
        run: gh auth setup-git
      - name: Verify and apply approved README history edits
        shell: bash
        run: |
          python - <<'PY'
          #!/usr/bin/env python3
          """Rewrite only the three approved README changes in NFULL07/NFULL07."""
          import argparse
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          import urllib.request

          REPOSITORY = "https://github.com/NFULL07/NFULL07.git"
          TOOL_URL = "https://raw.githubusercontent.com/newren/git-filter-repo/v2.47.0/git-filter-repo"
          TOOL_SHA256 = "67447413e273fc76809289111748870b6f6072f08b17efe94863a92d810b7d94"
          REPLACEMENTS = {'67977827214b5ef51988d7810c05995a29da8f69efc6c52da00f78e225496c79': '', '7a5b159de3264acb285487af7560a504616e0c5228b6be4c7192ee70af20fe16': '', 'a8e6a9f37a686adbfed5b3b5989c4182a25def5a662e916d6802e048d582f955': '', 'fac4b959601800d048fabb11059b2b68a0f3a7fcf89fff306c1892e7f5f1a8e2': ''}
          APPROVED_VERSIONS = ['14085ab6e523f13c70df90cb7cee392493cb042ce06b2c4333e28e33313bf9c0', '3c2a9ddccc446d1bbab2d33b4539e2518d76439730938e8b04849d8d1df3122a', '50ffa57ba08e3b5127c0b1ee689b50b3ececcb8a5615f53b1126d7edd56b0f35', '5d6cba9e58c5bfff6ff9fc45aedd422729bdfb06a9791cdcda08755cb16841c7', '67977827214b5ef51988d7810c05995a29da8f69efc6c52da00f78e225496c79', '792217c6984b5318dc3c68751f69f956f79401a886a6e8c533d330002a20a984', '7a5b159de3264acb285487af7560a504616e0c5228b6be4c7192ee70af20fe16', 'a74678de9501badbf2477970655b54dfad8d012e8bf1428b0751d096d15bb320', 'a8e6a9f37a686adbfed5b3b5989c4182a25def5a662e916d6802e048d582f955', 'fac4b959601800d048fabb11059b2b68a0f3a7fcf89fff306c1892e7f5f1a8e2']

          def clean_readme(data):
              digest = hashlib.sha256(data).hexdigest()
              if digest not in APPROVED_VERSIONS:
                  raise ValueError("A new README version needs review; no push performed.")
              replacement = REPLACEMENTS.get(digest)
              return base64.b64decode(replacement) if replacement else data


          def git(repo, *args):
              return subprocess.check_output(["git", "--git-dir", str(repo), *args])


          def refs(repo):
              result = {}
              for line in git(repo, "for-each-ref", "--format=%(refname) %(objectname)").decode().splitlines():
                  name, sha = line.split()
                  if not name.startswith(("refs/heads/", "refs/tags/")):
                      raise ValueError("Unexpected reference; no push performed.")
                  if git(repo, "cat-file", "-t", sha).strip() != b"commit":
                      raise ValueError("Annotated tags require separate review; no push performed.")
                  result[name] = sha
              return result


          def tree(repo, commit):
              result = {}
              for entry in git(repo, "ls-tree", "-rz", commit).split(b"\0"):
                  if entry:
                      header, path = entry.split(b"\t", 1)
                      mode, kind, oid = header.split()
                      result[path] = (mode, kind, oid)
              return result


          def commit_info(repo, commit):
              header, message = git(repo, "cat-file", "commit", commit).split(b"\n\n", 1)
              fields = [line for line in header.splitlines() if line.startswith((b"author ", b"committer "))]
              parents = [line.split()[1].decode() for line in header.splitlines() if line.startswith(b"parent ")]
              return fields, message, parents


          def main():
              parser = argparse.ArgumentParser()
              parser.add_argument("--source", default=REPOSITORY)
              parser.add_argument("--workdir")
              parser.add_argument("--filter-tool")
              parser.add_argument("--apply", action="store_true")
              args = parser.parse_args()
              if args.apply and args.source != REPOSITORY:
                  raise ValueError("Applying is restricted to NFULL07/NFULL07.")
              work = Path(args.workdir or tempfile.mkdtemp(prefix="profile-history-")).resolve()
              work.mkdir(parents=True, exist_ok=True)
              before, after = work / "before.git", work / "after.git"
              subprocess.run(["git", "clone", "--bare", "--no-hardlinks", args.source, str(before)], check=True)
              old_refs = refs(before)
              commits = git(before, "rev-list", "--all", "--reverse").decode().splitlines()
              if "refs/heads/main" not in old_refs:
                  raise ValueError("The expected main branch was not found.")
              readme_blobs = {}
              versions = {}
              for commit in commits:
                  entries = tree(before, commit)
                  if b"README.md" in entries:
                      oid = entries[b"README.md"][2]
                      if oid not in readme_blobs:
                          original = git(before, "cat-file", "blob", oid.decode())
                          updated = clean_readme(original)
                          if clean_readme(updated) != updated:
                              raise ValueError("The transformation is not idempotent.")
                          readme_blobs[oid] = (original, updated)
                          if original != updated:
                              versions[oid.decode()] = {
                                  "before": base64.b64encode(original).decode(),
                                  "after": base64.b64encode(updated).decode(),
                              }
              (work / "review.json").write_text(json.dumps(versions, ensure_ascii=False, indent=2))
              if not versions:
                  print("No approved text remains. Nothing to rewrite or push.")
                  return
              tool = Path(args.filter_tool) if args.filter_tool else work / "git-filter-repo"
              if not args.filter_tool:
                  with urllib.request.urlopen(TOOL_URL, timeout=30) as response:
                      tool.write_bytes(response.read())
              if hashlib.sha256(tool.read_bytes()).hexdigest() != TOOL_SHA256:
                  raise ValueError("git-filter-repo checksum verification failed.")
              replacements = {oid: base64.b64decode(value["after"]) for oid, value in versions.items()}
              callback = work / "readme_callback.py"
              callback.write_text(
                  "if filename == b'README.md':\n"
                  "    original = value.get_contents_by_identifier(blob_id)\n"
                  "    updated = " + repr({hashlib.sha256(readme_blobs[oid.encode()][0]).hexdigest(): data
                                            for oid, data in replacements.items()})
                  + ".get(__import__('hashlib').sha256(original).hexdigest())\n"
                  "    if updated is not None:\n"
                  "        blob_id = value.insert_file_with_contents(updated)\n"
                  "return (filename, mode, blob_id)\n"
              )
              subprocess.run(["git", "clone", "--bare", "--no-hardlinks", str(before), str(after)], check=True)
              subprocess.run([
                  sys.executable, str(tool), "--force", "--prune-empty", "never",
                  "--prune-degenerate", "never", "--preserve-commit-hashes",
                  "--replace-refs", "delete-no-add", "--file-info-callback", str(callback),
              ], cwd=after, check=True)
              mapping = {}
              for line in (after / "filter-repo" / "commit-map").read_text().splitlines()[1:]:
                  old, new = line.split()
                  if new == "0" * 40:
                      raise ValueError("A commit was unexpectedly removed.")
                  mapping[old] = new
              if set(mapping) != set(commits):
                  raise ValueError("Commit coverage differs from the original history.")
              new_refs = refs(after)
              if set(old_refs) != set(new_refs):
                  raise ValueError("Reference names changed.")
              for ref, old in old_refs.items():
                  if new_refs[ref] != mapping[old]:
                      raise ValueError("Unexpected reference mapping.")
              for old, new in mapping.items():
                  old_tree, new_tree = tree(before, old), tree(after, new)
                  if set(old_tree) != set(new_tree):
                      raise ValueError("Files were added or removed.")
                  for path, entry in old_tree.items():
                      new_entry = new_tree[path]
                      if path == b"README.md":
                          if entry[:2] != new_entry[:2]:
                              raise ValueError("README file mode changed.")
                          expected = readme_blobs[entry[2]][1]
                          actual = git(after, "cat-file", "blob", new_entry[2].decode())
                          if actual != expected:
                              raise ValueError("README differs from the approved transformation.")
                      elif entry != new_entry:
                          raise ValueError("A file other than README.md changed.")
                  old_fields, old_message, old_parents = commit_info(before, old)
                  new_fields, new_message, new_parents = commit_info(after, new)
                  if (old_fields, old_message, [mapping[p] for p in old_parents]) != (new_fields, new_message, new_parents):
                      raise ValueError("Author, date, message, or commit topology changed.")
              if len(git(after, "rev-list", "--all").splitlines()) != len(commits):
                  raise ValueError("The number of commits changed.")
              subprocess.run(["git", "--git-dir", str(after), "fsck", "--full"], check=True, capture_output=True)
              changes = {ref: (old, new_refs[ref]) for ref, old in old_refs.items() if old != new_refs[ref]}
              report = {
                  "verified_commits": len(commits), "readme_versions": len(readme_blobs),
                  "modified_readme_versions": len(versions), "changed_refs": list(changes),
                  "old_refs": old_refs, "new_refs": new_refs,
                  "non_readme_files_unchanged": True,
                  "authors_dates_messages_topology_preserved": True,
                  "applied": False,
              }
              report_path = work / "verification.json"
              report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2))
              print(json.dumps({k: report[k] for k in (
                  "verified_commits", "readme_versions", "modified_readme_versions", "changed_refs",
                  "non_readme_files_unchanged", "authors_dates_messages_topology_preserved")}, ensure_ascii=False, indent=2))
              if args.apply and changes:
                  command = ["git", "--git-dir", str(after), "push", "--atomic"]
                  command += ["--force-with-lease=" + ref + ":" + old for ref, (old, new) in changes.items()]
                  command += [REPOSITORY]
                  command += [new + ":" + ref for ref, (old, new) in changes.items()]
                  subprocess.run(command, check=True)
                  remote = subprocess.check_output(["git", "ls-remote", "--refs", REPOSITORY]).decode()
                  remote_refs = {line.split()[1]: line.split()[0] for line in remote.splitlines()}
                  for ref, (old, new) in changes.items():
                      if remote_refs.get(ref) != new:
                          raise ValueError("Remote verification failed after push.")
                  report["applied"] = True
                  report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2))
                  print("Published and verified the rewritten branch references.")
              else:
                  print("Local verification complete; no remote push was attempted.")


          if __name__ == "__main__":
              sys.argv.append("--apply")
              main()
          PY
